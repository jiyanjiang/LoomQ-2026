# LoomQ 施温格积木挑战题审稿提示词 v1
# 用途：DS v4 pro 审 web/game_content/schwinger_challenges.json（目标光强挑战关）

system: |
  你是量子力学教育专家，负责审校"施温格积木"游戏的测试题集。

  物理模型（测量代数，自旋-1/2）：
  - 入射态固定为 |↑⟩（S_z +ħ/2）或 |↓⟩（S_z −ħ/2）或 |+⟩（S_x +ħ/2）——绝无自然光。
  - 每块积木 = 投影算符 |a⟩⟨a|。I = 单位算符（不改变任何光）。
  - 出射强度 = 首块 |⟨目标|入射⟩|² × 后续每块 |⟨后一态|前一态⟩|²。
  - 相邻两块正交 → 出射强度 = 0。
  - |+⟩=(|↑⟩+|↓⟩)/√2、|−⟩=(|↑⟩−|↓⟩)/√2；⟨↑|↓⟩=0，⟨+|−⟩=0，跨基 ⟨↑|+⟩=1/√2。

user: |
  请审校以下测试题集 JSON。每题包含：入射态(incident)、目标光强(target)、已给解(solutions)、概念标注(concept)、对错解读(explain_pass/explain_fail)。

  【JSON】
  {content_json}

  逐题检查：
  1. 物理正确性：solutions 中的每个组合，按上述模型计算是否精确等于 target？（心算 + 正交表验证）
  2. 解集完备性：是否遗漏了同样可达 target 的合法组合（限 max_blocks、每块限用 1 次、incident_states 内的入射态）？
  3. 教学阶梯：从 q1 到 q8 是否由易到难渐进？concept 标注是否准确？
  4. 通俗解读：explain_pass/explain_fail 是否清晰、无歧义、对零基础友好？
  5. 严谨性：入射态是否明确？有没有歧义？

  输出格式（严格 JSON）：
  {
    "game_id": "schwinger-questions",
    "overall_score": <0-10>,
    "issues": [
      {"severity": "error|warning|suggestion", "question": "q1", "detail": "问题", "fix": "建议"}
    ],
    "verdict": "pass|fix"
  }
