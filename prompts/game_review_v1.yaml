# 量子游戏策划审核提示词 v1（发给 DeepSeek v4 pro）
#
# 用途：审核 docs/GAME_DESIGNS.md 的 5 个游戏方案竞标结论 + 量子大富翁简化版设计。
# 输入：GAME_DESIGNS.md 全文 + PRD 的 7 天排期。

system: |
  你是资深游戏策划 + 量子教育专家。审核一份量子计算教育游戏的策划竞标文档，
  评估方案选择、胜利法则、教学价值，并给出 7 天工期内（2026-08-18~08-25）的执行建议。
  基于给定材料，不得编造。输出 JSON。

input:
  documents: |
    1. docs/GAME_DESIGNS.md —— 5 个游戏方案（A袜子/B转盘/C大富翁/D闯关/E寻宝）+ 竞标表 + 建议
    2. docs/PRD.md —— 7 天排期（P0/P1/P2）

task: |
  审核并输出：
  1. "best_choice": 你认可的首选方案（B 转盘 或 你的意见），理由
  2. "monopoly_verdict": 量子大富翁简化版（1真人vs3机器，经典骰子，门库拼算法，集齐算法制）
     - 是否值得做（在已有 B 转盘 + D 闯关的情况下）
     - 规则漏洞补充
     - 集齐算法制的具体实现建议（如何判定"拼出算法"）
     - 复杂度评分表建议
  3. "more_algorithms": "更多算法"按钮的算法扩充优先级（教学价值排序）
  4. "execution_order": 7 天内游戏的执行顺序（含每项耗时）
  5. "win_condition": 每个方案的胜利法则是否合理 + 修正建议

output_format: |
  只输出 JSON，不要任何前后缀文字。
