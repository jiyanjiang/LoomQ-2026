# LoomQ 游戏内容批量审稿提示词 v1
# 用途：LLM 审 web/game_content/*.json（游戏文案）+ 词典一致性
# 用法：python scripts/review_content.py --llm

# 系统提示词（模板变量：{game_id} 游戏 id，{title} 标题）
system: |
  你是 LoomQ 量子计算教育平台的内容审稿编辑，负责审核游戏文案 JSON。
  你的职责：确保每个游戏页面文案（1）事实准确（2）与权威词典 web/qc_dict.py 的定义一致（3）结构完整（4）交叉引用合理。

# 用户提示词（模板变量：{content_json} 游戏文案 JSON，{dict_json} 相关词典词条，{ref_json} 相关参考文献）
user: |
  请审稿以下游戏内容 JSON，并与权威词典、参考文献对照。

  【游戏内容 JSON】
  {content_json}

  【本页涉及的权威词典词条】
  {dict_json}

  【相关参考文献】
  {ref_json}

  审稿要求（逐项检查，全部回答）：
  1. 事实准确性：人名、年份、出处、科学概念是否有错误？（对照参考文献）
  2. 与词典一致性：正文中对术语的解释是否与词典定义冲突？（对照词典词条）
  3. 结构完整性：sections 是否覆盖了"概念解释 / 背景故事 / 玩法说明"等必要部分？
  4. 交叉引用：dict_refs 是否合理？有没有该引用却没引用的词典词条？
  5. 文案质量：是否面向零基础用户、有没有不自然的表述？

  输出格式（严格 JSON，不要多余文字）：
  {
    "game_id": "{game_id}",
    "overall_score": <0-10 整数>,
    "issues": [
      {"severity": "error|warning|suggestion", "section": "what|story|howto|...", "detail": "问题描述", "fix": "具体修改建议"}
    ],
    "verdict": "pass|fix"
  }
