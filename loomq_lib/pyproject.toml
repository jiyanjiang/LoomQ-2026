[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomq-lib"
version = "0.1.0"
description = "LoomQ quantum circuit toolkit: ruler (qelib1.inc semantics), 3-backend runner, and circuit library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
backends = [
    "spinqit==0.2.4",
    "pyqpanda==3.8.5",
    "amazon-braket-sdk==1.95.0",
    "amazon-braket-default-simulator==1.27.0",
]

[tool.setuptools.packages.find]
include = ["loomq_lib*"]
